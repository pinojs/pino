name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version number to tag and release'
        required: true
        type: string
      prerelease:
        description: 'Release as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  release-npm:
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install npm -g
      - run: npm install
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION'. Expected a semantic version such as 1.2.3 or v1.2.3."
            exit 1
          fi
      - name: Change version number and sync
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node build/sync-version.js "$VERSION"
      - name: GIT commit and push all changed files
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          git config --global user.name "mcollina"
          git config --global user.email "hello@matteocollina.com"
          git commit -n -a -m "Bumped v$VERSION"
          git push origin HEAD:"$REF"
      - run: npm publish --access public --tag ${{ inputs.prerelease == true && 'next' || 'latest' }}
      - name: 'Create release notes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          npx @matteo.collina/release-notes -a "$GITHUB_TOKEN" -t "v$VERSION" -r pino -o pinojs ${{ github.event.inputs.prerelease == 'true' && '-p' || '' }} -c "$REF"
